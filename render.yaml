# Put this file and the app's package.json at the root of a dedicated private repository.
services:
  - type: web
    name: sol-trader
    runtime: node
    region: singapore
    plan: starter
    numInstances: 1
    autoDeployTrigger: off
    buildCommand: npx --yes pnpm@11.19.0 install --frozen-lockfile --prod
    startCommand: node src/main.js
    healthCheckPath: /healthz
    maxShutdownDelaySeconds: 90
    domains:
      - soltraderbot.com
    disk:
      name: sol-trader-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 24.19.0
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATA_DIR
        value: /var/data/sol-trader
      - key: PUBLIC_APP_URL
        value: https://soltraderbot.com
      - key: TRADING_MODE
        value: paper
      - key: DOGE_MINT
        value: DoGEV7LASBkQbibMc5k5vKnTZoMg423GpJ5QtJEGfm7R
      - key: DOGE_DECIMALS
        value: "8"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_OWNER_ID
        sync: false
      - key: WALLET_ENCRYPTION_KEY
        sync: false
      - key: JUPITER_API_KEY
        sync: false
      - key: SOLANA_RPC_URL
        value: https://api.mainnet-beta.solana.com
